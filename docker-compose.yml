services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: healthsync
      POSTGRES_USER: healthsync
      POSTGRES_PASSWORD: healthsync
    ports:
      - "5432:5432"
    volumes:
      - healthsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  healthsync_postgres_data:
